# 毎週、直近に提出された有価証券報告書で内蔵データ(1株配当・配当性向・新規上場)を新しい期に進める。
# リポジトリの Settings → Secrets and variables → Actions に EDINET_API_KEY が必要。
# Actions の画面の「Run workflow」から手動でも動かせる。
name: EDINETの週次更新
on:
  schedule:
    - cron: "23 1 * * 1"   # 毎週月曜 10:23(日本時間)
  workflow_dispatch:
    inputs:
      days:
        description: "何日前までの提出を見るか"
        default: "45"
permissions:
  contents: write
  pages: write
concurrency: edinet-monthly
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 有報で内蔵データを更新
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python3 tools/edinet/monthly.py --days "${{ inputs.days || '45' }}"
      - name: 変わっていればコミットして公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add index.html tools/edinet/state.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "EDINETの有報で内蔵データを更新($(date +%Y-%m))"
          git push
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
